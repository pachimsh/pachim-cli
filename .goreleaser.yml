version: 2

project_name: pachim

builds:
  - main: .
    binary: pachim
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/pachimsh/cli/cmd.version={{.Version}}
      - -X main.apiBaseURL=https://api.pachim.sh

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: pachimsh
    name: pachim-cli
  draft: false
  prerelease: auto
  mode: append

scoops:
  - repository:
      owner: pachimsh
      name: scoop-bucket
    homepage: "https://pachim.sh"
    description: "Deploy your projects to Pachim servers"
    license: "MIT"

winget:
  - name: pachim
    package_identifier: Pachim.PachimCLI
    publisher: Pachim
    short_description: "Deploy your projects to Pachim servers"
    license: "MIT"
    homepage: "https://pachim.sh"
    repository:
      owner: pachimsh
      name: winget-pkgs
      branch: "pachim-{{.Version}}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

# Homebrew can be added later via homebrew_casks (GoReleaser v2.16+).
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

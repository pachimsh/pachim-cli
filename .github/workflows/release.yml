name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}

      - name: Set up SSH for mirror upload
        if: vars.PACHIM_MIRROR_ENABLED == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PACHIM_DEPLOY_KEY }}

      - name: Upload binaries to pachim.sh mirror
        if: vars.PACHIM_MIRROR_ENABLED == 'true'
        env:
          PACHIM_DEPLOY_HOST: ${{ secrets.PACHIM_DEPLOY_HOST }}
          PACHIM_DEPLOY_USER: ${{ secrets.PACHIM_DEPLOY_USER }}
          PACHIM_DEPLOY_PATH: ${{ vars.PACHIM_DEPLOY_PATH }}
        run: bash .github/scripts/upload-mirror.sh
